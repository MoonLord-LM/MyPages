    .drop {

      color: #59636e; background: #f7faff; cursor: pointer; transition: border-color .2s, background .2s;

    .drop input[type="file"] { display: none; }
    .file-info { margin-top: 12px; font-size: 14px; color: #1f2328; word-break: break-all; }

    .qr-preview {
      display: inline-block; padding: 12px; background: #fff; border: 1px solid #e3e8ef;
      border-radius: 10px; line-height: 0;
    }
    .qr-preview img, .qr-preview video { display: block; max-width: 100%; max-height: 300px; object-fit: contain; }
    .hide { display: none; }

    .text-out {
      width: 100%; padding: 11px 14px; font-size: 14px; border: 1px solid #ccc;
      border-radius: 8px; outline: none; resize: vertical; font-family: inherit;
      color: #1f2328; background: #f6f8fa; word-break: break-all;
    }
    .text-out:focus { border-color: #2a5298; }

    .actions {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start;
      gap: 12px; margin: 28px 0;
    }
    .mode-tabs {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start;
      gap: 12px; margin: 20px 0;
    }
    .btn, .btn-mini {
      min-width: 132px; padding: 11px 22px; font-size: 16px; font-weight: 600; line-height: 1.5;
      border: 1px solid transparent; border-radius: 8px; cursor: pointer;
      transition: opacity .2s, transform .1s, border-color .2s, background .2s, color .2s;
    }
    .mode-tabs button {
      min-width: 84px; padding: 7px 14px; font-size: 13px; font-weight: 600; line-height: 1.4;
      border: 1px solid transparent; border-radius: 8px; cursor: pointer;
      transition: opacity .2s, transform .1s, border-color .2s, background .2s, color .2s;
    }
    .btn-mini, .mode-tabs button { color: #2a5298; background: #fff; border-color: #cdd7e3; }
    .btn, .mode-tabs button.active {
      color: #fff; background: linear-gradient(135deg, #6ba0ea, #9b6fe0); border-color: transparent;
    }
    .btn:hover, .mode-tabs button.active:hover { opacity: .92; }
    .btn-mini:hover, .mode-tabs button:not(.active):hover { border-color: #2a5298; background: #f0f5fc; }
    .btn:active, .btn-mini:active, .mode-tabs button:active { transform: translateY(1px); }
    .btn:disabled, .btn-mini:disabled, .mode-tabs button:disabled { opacity: .5; cursor: not-allowed; }

    .spinner {
      display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.5);
      border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .log {
      margin-top: 20px; border-radius: 10px; padding: 14px 16px; font-size: 14px;
      background: #f6f8fa; border: 1px solid #e3e8ef; white-space: pre-wrap; word-break: break-all;
      max-height: 240px; overflow: auto;
    }
    .log.ok { background: #eafaf0; border-color: #b7e4c7; color: #1a7f43; }
    .log.err { background: #fdecec; border-color: #f5c2c2; color: #b3261e; }

    .tips { margin-bottom: 44px; background: #f3f7fc; border: 1px solid #dce6f2; border-radius: 10px; padding: 12px 16px; font-size: 14px; color: #59636e; }
    .tips div { line-height: 1.8; }
    .tips code { background: #e3ecf7; padding: .05em .35em; border-radius: 4px; }

<script>
  (function () {
    const toggle  = document.getElementById('searchToggle');
    const overlay = document.getElementById('searchOverlay');
    const input   = document.getElementById('searchInput');
    const submit  = document.getElementById('searchSubmit');

    function openSearch() { overlay.classList.add('open'); input.focus(); }
    function closeSearch() { overlay.classList.remove('open'); }
    function doSearch() {
      const q = input.value.trim();
      const site = 'site:moonlord.cc';
      const url = 'https://www.google.com/search?q=' + encodeURIComponent(q ? site + ' ' + q : site);
      window.open(url, '_blank');
      closeSearch();
    }

    toggle.addEventListener('click', openSearch);
    submit.addEventListener('click', doSearch);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeSearch(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeSearch();
    });
  })();

    <div class="panel">

  <script src="assets/jsQR.min.js"></script>
  <script>
  (function () {
    'use strict';

    const MAX_SIDE = 3840;

    const $ = (id) => document.getElementById(id);
    const dropEl = $('drop');
    const fileInput = $('fileInput');
    const fileInfoEl = $('fileInfo');
    const previewWrap = $('previewWrap');
    const preview = $('preview');
    const decodeBtn = $('decodeBtn');
    const copyBtn = $('copyBtn');
    const textOut = $('textOut');
    const logEl = $('log');
    const captureWrap = $('captureWrap');
    const captureVideo = $('captureVideo');
    const captureBtn = $('captureBtn');
    const cameraBtn = $('cameraBtn');

    let selectedFile = null;
    let previewUrl = null;
    let captureStream = null;
    let scanId = 0;
    let lastScan = 0;

    function clearLog() { logEl.className = 'log hide'; logEl.textContent = ''; }
    function log(msg, kind) {
      logEl.className = 'log' + (kind ? ' ' + kind : '');
      logEl.textContent = msg;
    }
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      const units = ['KB', 'MB', 'GB', 'TB'];
      let i = -1, n = bytes;
      do { n /= 1024; i++; } while (n >= 1024 && i < units.length - 1);
      return n.toFixed(2) + ' ' + units[i];
    }

    dropEl.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      if (fileInput.files && fileInput.files.length) setFile(fileInput.files[0]);
    });
    ['dragenter', 'dragover'].forEach((ev) =>
      dropEl.addEventListener(ev, (e) => { e.preventDefault(); dropEl.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach((ev) =>
      dropEl.addEventListener(ev, (e) => { e.preventDefault(); dropEl.classList.remove('dragover'); }));
    dropEl.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      if (dt && dt.files && dt.files.length) setFile(dt.files[0]);
    });
    document.addEventListener('paste', (e) => {
      const files = e.clipboardData && e.clipboardData.files;
      if (files && files.length) setFile(files[0]);
    });

    function setFile(file) {
      if (!file || !/^image\//.test(file.type)) { log('请选择图片文件', 'err'); return; }
      selectedFile = file;
      fileInfoEl.textContent = '已选择：' + (file.name || '粘贴的图片') + '（' + formatSize(file.size) + '）';
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      showPreview(previewUrl);
      previewWrap.classList.remove('hide');
      textOut.value = '';
      clearLog();
    }

    function fitSize(w, h) {
      const scale = Math.min(MAX_SIDE / Math.max(w, h), Math.max(1, 300 / Math.min(w, h)));
      return { w: Math.max(1, Math.round(w * scale)), h: Math.max(1, Math.round(h * scale)) };
    }

    function showPreview(url) {
      const img = new Image();
      img.onload = () => {
        const size = fitSize(img.width, img.height);
        const canvas = document.createElement('canvas');
        canvas.width = size.w;
        canvas.height = size.h;
        canvas.getContext('2d').drawImage(img, 0, 0, size.w, size.h);
        preview.src = canvas.toDataURL('image/png');
      };
      img.onerror = () => {
        preview.removeAttribute('src');
        previewWrap.classList.add('hide');
        log('图片无法预览', 'err');
      };
      img.src = url;
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片无法读取或格式不受支持')); };
        img.src = url;
      });
    }

    function recognizeCanvas(canvas) {
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      return window.jsQR(imageData.data, canvas.width, canvas.height, { inversionAttempts: 'attemptBoth' });
    }

    function showResult(res, w, h, source) {
      textOut.value = res.data;
      log((source || '识别成功') + '，共 ' + Array.from(res.data).length +
          ' 个字符\n图像尺寸：' + w + '×' + h, 'ok');
    }

    function mediaError(e) {
      const name = (e && e.name) || '';
      if (name === 'NotAllowedError' || name === 'SecurityError') return '权限被拒绝或已取消';
      if (name === 'NotFoundError' || name === 'DevicesNotFoundError') return '未找到摄像头';
      if (name === 'NotReadableError' || name === 'TrackStartError') return '设备被其它程序占用';
      if (name === 'OverconstrainedError') return '不支持所请求的摄像头模式';
      return (e && e.message) || '未知错误';
    }

    function stopCapture() {
      cancelAnimationFrame(scanId);
      scanId = 0;
      if (captureStream) {
        captureStream.getTracks().forEach((t) => t.stop());
        captureStream = null;
      }
      captureVideo.pause();
      captureVideo.srcObject = null;
      captureWrap.classList.add('hide');
      cameraBtn.textContent = '摄像识别';
      captureBtn.disabled = false;
      cameraBtn.disabled = false;
    }

    async function openStream(method, constraints) {
      if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices[method]) {
        throw new Error('当前浏览器不支持该功能，或页面不是安全上下文（需要 HTTPS / localhost）');
      }
      const stream = await navigator.mediaDevices[method](constraints);
      captureStream = stream;
      captureVideo.srcObject = stream;
      await captureVideo.play();
      const track = stream.getVideoTracks()[0];
      if (track) track.addEventListener('ended', stopCapture, { once: true });
      for (let i = 0; i < 20 && !captureVideo.videoWidth; i++) {
        await new Promise((r) => setTimeout(r, 50));
      }
      if (!captureVideo.videoWidth) throw new Error('未获取到视频画面');
    }

    function frameToBlob() {
      const scale = Math.min(1, MAX_SIDE / Math.max(captureVideo.videoWidth, captureVideo.videoHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(captureVideo.videoWidth * scale));
      canvas.height = Math.max(1, Math.round(captureVideo.videoHeight * scale));
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(captureVideo, 0, 0, canvas.width, canvas.height);
      return new Promise((resolve, reject) => {
        canvas.toBlob((b) => b ? resolve(b) : reject(new Error('画面截取失败')), 'image/png');
      });
    }

    async function captureScreen() {
      stopCapture();
      clearLog();
      textOut.value = '';
      if (!window.jsQR) { log('解码库未加载，请刷新页面重试', 'err'); return; }
      captureBtn.disabled = true;
      captureBtn.innerHTML = '<span class="spinner"></span>处理中…';
      try {
        captureWrap.classList.remove('hide');
        await openStream('getDisplayMedia', { video: true, audio: false });
        await new Promise((r) => setTimeout(r, 200));
        const blob = await frameToBlob();
        stopCapture();
        setFile(new File([blob], '截屏.png', { type: 'image/png' }));
        await decode();
      } catch (e) {
        stopCapture();
        log('截屏失败：' + mediaError(e), 'err');
      } finally {
        captureBtn.disabled = false;
        captureBtn.textContent = '截屏识别';
      }
    }

    function scanFrame(ts) {
      if (!captureStream) return;
      if (ts - lastScan >= 200) {
        lastScan = ts;
        const vw = captureVideo.videoWidth, vh = captureVideo.videoHeight;
        if (vw && vh) {
          const scale = Math.min(1, 800 / Math.max(vw, vh));
          const w = Math.max(1, Math.round(vw * scale));
          const h = Math.max(1, Math.round(vh * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(captureVideo, 0, 0, w, h);
          const res = recognizeCanvas(canvas);
          if (res) {
            preview.src = canvas.toDataURL('image/png');
            previewWrap.classList.remove('hide');
            showResult(res, w, h, '摄像头识别成功');
            stopCapture();
            return;
          }
        }
      }
      scanId = requestAnimationFrame(scanFrame);
    }

    async function toggleCamera() {
      if (captureStream) { stopCapture(); clearLog(); log('已停止摄像', 'ok'); return; }
      clearLog();
      textOut.value = '';
      if (!window.jsQR) { log('解码库未加载，请刷新页面重试', 'err'); return; }
      cameraBtn.disabled = true;
      cameraBtn.innerHTML = '<span class="spinner"></span>处理中…';
      try {
        captureWrap.classList.remove('hide');
        await openStream('getUserMedia', { video: { facingMode: { ideal: 'environment' } }, audio: false });
        cameraBtn.textContent = '停止摄像';
        lastScan = 0;
        scanId = requestAnimationFrame(scanFrame);
        log('摄像头已开启，请将二维码对准取景框', 'ok');
      } catch (e) {
        stopCapture();
        log('无法打开摄像头：' + mediaError(e), 'err');
      } finally {
        cameraBtn.disabled = false;
        cameraBtn.textContent = captureStream ? '停止摄像' : '摄像识别';
      }
    }

    function setBusy(busy) {
      decodeBtn.disabled = busy;
      if (busy) {
        decodeBtn.innerHTML = '<span class="spinner"></span>处理中…';
      } else {
        decodeBtn.textContent = '识别二维码';
      }
    }

    async function decode() {
      clearLog();
      textOut.value = '';
      if (!selectedFile) { log('请先选择二维码图片', 'err'); return; }
      if (!window.jsQR) { log('解码库未加载，请刷新页面重试', 'err'); return; }
      setBusy(true);
      try {
        const img = await loadImage(selectedFile);
        const size = fitSize(img.width, img.height);
        const w = size.w, h = size.h;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const res = recognizeCanvas(canvas);
        if (!res) {
          textOut.value = '';
          log('未识别到二维码，请确认图片清晰、二维码完整且未被过度缩小', 'err');
          return;
        }
        showResult(res, w, h);
      } catch (e) {
        log('识别失败：' + (e && e.message ? e.message : e), 'err');
      } finally {
        setBusy(false);
      }
    }

    copyBtn.addEventListener('click', () => {
      if (!textOut.value) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textOut.value).then(
          () => log('识别结果已复制到剪贴板', 'ok'),
          () => textOut.select()
        );
      } else {
        textOut.select();
        log('已选中结果，请按 Ctrl+C 复制');
      }
    });

    decodeBtn.addEventListener('click', decode);
    captureBtn.addEventListener('click', captureScreen);
    cameraBtn.addEventListener('click', toggleCamera);
    window.addEventListener('pagehide', stopCapture);
  })();
  </script>
