<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐推荐</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .wrap h1 { font-size: 28px; color: #1f2328; padding-bottom: .3em; border-bottom: 1px solid #d8dee4; margin-bottom: 24px; }
    .player {
      background: #fff; border: 1px solid #e3e8ef; border-radius: 16px;
      padding: 14px 20px; box-shadow: 0 6px 20px rgba(0,0,0,.06); margin-bottom: 28px;
      display: flex; align-items: center; gap: 18px;
    }
    .controls { display: flex; align-items: center; gap: 14px; flex: 0 0 auto; }
    .player-center { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .player-top { display: flex; align-items: center; gap: 14px; }
    .player-bottom { display: flex; align-items: center; gap: 6px; }
    .player-cover {
      width: 56px; height: 56px; border-radius: 10px; flex: 0 0 auto;
      background: linear-gradient(135deg, #bcd6f6, #d6c4f0);
      display: flex; align-items: center; justify-content: center; color: #6b8fc8;
      box-shadow: 0 4px 14px rgba(107,160,234,.18); overflow: hidden;
    }
    .player-cover svg { width: 26px; height: 26px; }
    .player-meta { flex: 1 1 auto; min-width: 0; }
    .player-title { font-size: 16px; font-weight: 600; color: #1f2328; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progress-track {
      position: relative; flex: 1; height: 6px; border-radius: 3px;
      background: #e3e8ef; cursor: pointer; touch-action: none;
    }
    .progress-buffer {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
      border-radius: 3px; background: rgba(107,160,234,.28);
    }
    .progress-fill {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
      border-radius: 3px; background: linear-gradient(135deg, #6ba0ea, #9b6fe0);
    }
    .progress-thumb {
      position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; border-radius: 50%; background: #fff;
      border: 3px solid #6ba0ea; box-shadow: 0 1px 4px rgba(0,0,0,.2); pointer-events: none;
    }
    .time { font-size: 12px; color: #59636e; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; white-space: nowrap; }
    .ctrl-btn {
      border: none; background: transparent; cursor: pointer; color: #1f2328;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .ctrl-btn svg { width: 26px; height: 26px; }
    .play-btn {
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, #6ba0ea, #9b6fe0); color: #fff;
      box-shadow: 0 6px 18px rgba(107,160,234,.4); transition: transform .15s;
    }
    .play-btn:hover { transform: scale(1.06); }
    .play-btn svg { width: 24px; height: 24px; }
    .song-list {
      list-style: none; margin-top: 14px;
      border: 1px solid #e3e8ef; border-radius: 12px;
      overflow: hidden; background: #fff;
    }
    .song-item {
      display: flex; align-items: center; gap: 12px; padding: 7px 12px;
      border-bottom: 1px solid #f2f4f7; cursor: pointer; color: #1f2329;
      transition: background .12s, color .12s;
    }
    .song-item:last-child { border-bottom: none; }
    .song-item:hover { background: #f6f8fb; }
    .song-item.active { color: #4a72c4; font-weight: 600; }
    .song-cover {
      width: 40px; height: 40px; border-radius: 8px; flex: 0 0 auto;
      object-fit: cover; background: #eef2f8;
    }
    .song-index { width: 22px; text-align: right; color: #8a949e; font-size: 13px; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .song-item.active .song-index { color: #4a72c4; }
    .song-title { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-dur { font-size: 12px; color: #8a949e; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
    .vol-btn {
      border: none; background: transparent; cursor: pointer; color: #1f2328;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .vol-btn svg { width: 24px; height: 24px; }
    .vol-wrap { position: relative; display: flex; align-items: center; }
    .vol-pop {
      position: absolute; bottom: calc(100% + 14px); left: 50%; transform: translateX(-50%);
      background: #fff; border: 1px solid #e3e8ef; border-radius: 12px; padding: 14px 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,.14); display: none; flex-direction: column;
      align-items: center; gap: 10px;
    }
    .vol-pop.open { display: flex; }
    .vol-pop::after {
      content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      border: 7px solid transparent; border-top-color: #fff;
    }
    .vol-track {
      position: relative; width: 6px; height: 100px; border-radius: 3px;
      background: #e3e8ef; cursor: pointer; touch-action: none;
    }
    .vol-fill {
      position: absolute; left: 0; right: 0; bottom: 0; height: 50%;
      border-radius: 3px; background: linear-gradient(180deg, #9b6fe0, #6ba0ea);
    }
    .vol-thumb {
      position: absolute; left: 50%; bottom: 50%; transform: translate(-50%, 50%);
      width: 14px; height: 14px; border-radius: 50%; background: #fff;
      border: 3px solid #6ba0ea; box-shadow: 0 1px 4px rgba(0,0,0,.2); pointer-events: none;
    }
    .loop-btn {
      border: none; background: transparent; cursor: pointer; color: #1f2328;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .loop-btn svg { width: 24px; height: 24px; }
    @media (max-width: 560px) {
      .player { flex-wrap: wrap; }
      .player-center { flex: 1 1 100%; order: -1; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>音乐推荐</h1>
    <div class="player">
      <div class="controls">
        <button class="ctrl-btn" id="prev" aria-label="上一首">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="play" aria-label="播放/暂停">
          <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="next" aria-label="下一首">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-9.5 0l8.5 6-8.5 6z"/></svg>

      </div>
      <div class="player-center">
        <div class="player-top">
          <div class="player-cover" id="cover">

          </div>
          <div class="player-meta">
            <div class="player-title" id="title">未选择歌曲</div>
          </div>
        </div>
        <div class="player-bottom">
          <div class="progress-track" id="track">
            <div class="progress-buffer" id="buffer"></div>
            <div class="progress-fill" id="fill"></div>
            <div class="progress-thumb" id="thumb"></div>
          </div>
          <span class="time" id="time">00:00 / 00:00</span>
        </div>
      </div>
      <div class="controls">
        <div class="vol-wrap">
          <button class="vol-btn" id="mute" aria-label="音量">
            <svg viewBox="0 0 24 24" fill="currentColor" id="volIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"/></svg>
          </button>
          <div class="vol-pop" id="volPop">
            <div class="vol-track" id="volTrack">
              <div class="vol-fill" id="volFill"></div>
              <div class="vol-thumb" id="volThumb"></div>
            </div>
          </div>
        </div>
        <button class="loop-btn" id="loop" aria-label="循环模式">
          <svg viewBox="0 0 24 24" fill="currentColor" id="loopIcon"></svg>
        </button>
      </div>
    </div>
    <ul class="song-list" id="list"></ul>
    <audio id="audio" preload="metadata"></audio>
  </main>

      { name: '2021 yihuik苡慧 - 致你', cover: 'https://cloudflare.moonlord.cc/static/music/2021%20yihuik苡慧%20-%20致你.jpg', src: 'https://cloudflare.moonlord.cc/static/music/2021%20yihuik苡慧%20-%20致你.m4a' },
      { name: '2021 刘梦妤Uu - 气象站台', cover: 'https://cloudflare.moonlord.cc/static/music/2021%20刘梦妤Uu%20-%20气象站台.jpg', src: 'https://cloudflare.moonlord.cc/static/music/2021%20刘梦妤Uu%20-%20气象站台.m4a' },
      { name: '2021 戴羽彤 - 来迟', cover: 'https://cloudflare.moonlord.cc/static/music/2021%20戴羽彤%20-%20来迟.jpg', src: 'https://cloudflare.moonlord.cc/static/music/2021%20戴羽彤%20-%20来迟.m4a' },
      { name: '2021 苏星婕 - 风吹过八千里', cover: 'https://cloudflare.moonlord.cc/static/music/2021%20苏星婕%20-%20风吹过八千里.jpg', src: 'https://cloudflare.moonlord.cc/static/music/2021%20苏星婕%20-%20风吹过八千里.m4a' },
      { name: '2021 陈子晴 - 偏向', cover: 'https://cloudflare.moonlord.cc/static/music/2021%20陈子晴%20-%20偏向.jpg', src: 'https://cloudflare.moonlord.cc/static/music/2021%20陈子晴%20-%20偏向.m4a' },
      { name: '2022 yihuik苡慧 - 麦浪', cover: 'https://cloudflare.moonlord.cc/static/music/2022%20yihuik苡慧%20-%20麦浪.jpg', src: 'https://cloudflare.moonlord.cc/static/music/2022%20yihuik苡慧%20-%20麦浪.m4a' },
      { name: '2024 庄东茹 - 又活了一天', cover: 'https://cloudflare.moonlord.cc/static/music/2024%20庄东茹%20-%20又活了一天.jpg', src: 'https://cloudflare.moonlord.cc/static/music/2024%20庄东茹%20-%20又活了一天.m4a' }
    ];

    const audio = document.getElementById('audio');
    const titleEl = document.getElementById('title');
    const track = document.getElementById('track');
    const fill = document.getElementById('fill');
    const buffer = document.getElementById('buffer');
    const thumb = document.getElementById('thumb');
    const timeEl = document.getElementById('time');
    const playBtn = document.getElementById('play');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const listEl = document.getElementById('list');
    const coverEl = document.getElementById('cover');
    const muteBtn = document.getElementById('mute');
    const volIcon = document.getElementById('volIcon');
    const volTrack = document.getElementById('volTrack');
    const volFill = document.getElementById('volFill');
    const volThumb = document.getElementById('volThumb');
    const volPop = document.getElementById('volPop');
    const loopBtn = document.getElementById('loop');
    const loopIcon = document.getElementById('loopIcon');

    let songEls = [];
    let durEls = [];
    let current = -1;
    let dragging = false;
    let volDragging = false;
    let activeLoad = null;

    const PLAY_PATH = 'M8 5v14l11-7z';
    const PAUSE_PATH = 'M6 5h4v14H6zM14 5h4v14h-4z';

    function fmt(t) {
      if (!isFinite(t) || t < 0) return '00:00';
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function updateTimeLabel() {
      timeEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
    }

    function renderList() {
      songEls.forEach((li, i) => li.classList.toggle('active', i === current));
    }

    function renderSongList() {
      listEl.innerHTML = '';
      songEls = [];
      durEls = [];
      songs.forEach((s, i) => {
        const li = document.createElement('li');
        li.className = 'song-item';
        const img = document.createElement('img');
        img.className = 'song-cover';
        img.src = s.cover;
        img.alt = '';
        img.loading = 'lazy';
        const idx = document.createElement('span');
        idx.className = 'song-index';
        idx.textContent = String(i + 1);
        const title = document.createElement('span');
        title.className = 'song-title';
        title.textContent = s.name;
        const dur = document.createElement('span');
        dur.className = 'song-dur';
        dur.textContent = '—';
        li.appendChild(img);
        li.appendChild(idx);
        li.appendChild(title);
        li.appendChild(dur);
        li.addEventListener('click', () => playIndex(i));
        listEl.appendChild(li);
        songEls.push(li);
        durEls.push(dur);
      });
    }

    function clearLoad() {
      if (activeLoad) {
        if (activeLoad.controller) { try { activeLoad.controller.abort(); } catch (e) {} }
        if (activeLoad.objectUrl) { try { URL.revokeObjectURL(activeLoad.objectUrl); } catch (e) {} }
      }
      try { audio.pause(); } catch (e) {}
      activeLoad = null;
    }

    function concatChunks(chunks) {
      let len = 0;
      for (const c of chunks) len += c.length;
      const out = new Uint8Array(len);
      let o = 0;
      for (const c of chunks) { out.set(c, o); o += c.length; }
      return out;
    }

    // m4a 的 moov 原子含元数据：在前(faststart)可提前开播，在尾部需下载接近完成
    function moovComplete(ld) {
      const buf = concatChunks(ld.chunks);
      let p = 0;
      while (p + 8 <= buf.length) {
        const size = (buf[p] << 24) | (buf[p + 1] << 16) | (buf[p + 2] << 8) | buf[p + 3];
        const type = String.fromCharCode(buf[p + 4], buf[p + 5], buf[p + 6], buf[p + 7]);
        if (type === 'moov') return (p + size) <= buf.length;
        if (size <= 0) return false;
        p += size;
      }
      return false;
    }

    function updateDownload(ld) {
      const pct = ld.total ? ld.received / ld.total : 0;
      buffer.style.width = (pct * 100) + '%';
    }

    // 原生流式：按 audio.buffered 更新缓冲条
    function updateNativeBuffer() {
      const ld = activeLoad;
      if (!ld || !ld.native) return;
      const b = audio.buffered;
      if (b && b.length) {
        const end = b.end(b.length - 1);
        const total = audio.duration && isFinite(audio.duration) ? audio.duration : 0;
        if (total) buffer.style.width = Math.min(1, end / total) * 100 + '%';
        else buffer.style.width = '0%';
      }
    }

    // 封面：直接使用 list.json 中的预提取图片，秒出且可被浏览器缓存
    let coverTok = 0;
    function clearCover() {
      coverEl.style.backgroundImage = '';
      coverEl.style.backgroundSize = '';
      coverEl.style.backgroundPosition = '';
      const svg = coverEl.querySelector('svg');
      if (svg) svg.style.display = '';
    }
    function showCover(url) {
      coverEl.style.backgroundImage = 'url("' + url + '")';
      coverEl.style.backgroundSize = 'cover';
      coverEl.style.backgroundPosition = 'center';
      const svg = coverEl.querySelector('svg');
      if (svg) svg.style.display = 'none';
    }
    function loadCover(url) {
      const tok = ++coverTok;
      const img = new Image();
      img.onload = () => { if (tok === coverTok) showCover(url); };
      img.onerror = () => { if (tok === coverTok) clearCover(); };
      img.src = url;
    }

    function makeBlobUrl(ld) {
      const blob = new Blob(ld.chunks, { type: 'audio/mp4' });
      if (ld.objectUrl) { try { URL.revokeObjectURL(ld.objectUrl); } catch (e) {} }
      ld.objectUrl = URL.createObjectURL(blob);
      return ld.objectUrl;
    }

    function startPlayback(ld) {
      ld.started = true;
      ld.lastExtend = ld.received;
      audio.src = makeBlobUrl(ld);
      audio.currentTime = 0;
      if (ld.playing) audio.play().catch(() => {});
    }

    function extendIfNeeded(ld, force) {
      if (!ld.started || ld.extending || ld.complete) return;
      const b = audio.buffered;
      const bufferedEnd = (b && b.length) ? b.end(b.length - 1) : 0;
      const needExtend = force || (bufferedEnd - audio.currentTime < 5 && ld.received - ld.lastExtend > 2 * 1048576);
      if (!needExtend) return;
      ld.extending = true;
      ld.lastExtend = ld.received;
      const t = audio.currentTime;
      const wasPlaying = !audio.paused;
      audio.src = makeBlobUrl(ld);
      audio.addEventListener('loadedmetadata', function onMeta() {
        audio.removeEventListener('loadedmetadata', onMeta);
        ld.extending = false;
        if (isFinite(t) && t < audio.duration) { try { audio.currentTime = t; } catch (e) {} }
        if (wasPlaying) audio.play().catch(() => {});
      });
    }

    function maybeStartOrExtend(ld) {
      if (!ld.started) {
        const doCheck = (ld.total && ld.received / ld.total > 0.9) ||
                        (ld.received - (ld.lastMoovCheck || 0) > 2 * 1048576);
        if (doCheck) {
          ld.lastMoovCheck = ld.received;
          if (moovComplete(ld)) { startPlayback(ld); return; }
        }
      } else {
        extendIfNeeded(ld, false);
      }
    }

    // 原生可流式格式：元数据在前、按帧解码，交给浏览器 <audio> 原生边下边播
    function isNativeStreamable(src) {
      return /\.(mp3|ogg|oga|opus|webm|wav|aac|flac)(?:[?#]|$)/i.test(src || '');
    }

    // 入口：原生可流式格式走浏览器，m4a/mp4 走 fetch 分块
    function load(i, autoplay) {
      if (isNativeStreamable(songs[i] && songs[i].src)) loadNative(i, autoplay);
      else loadFetch(i, autoplay);
    }

    // 原生流式：直接设 audio.src，交给浏览器接管下载/解码/缓冲
    function loadNative(i, autoplay) {
      current = i;
      const song = songs[i];
      clearLoad();
      clearCover();
      titleEl.textContent = song.name;
      fill.style.width = '0%';
      thumb.style.left = '0%';
      buffer.style.width = '0%';
      timeEl.textContent = '00:00 / 00:00';
      renderList();
      activeLoad = { native: true, started: false };
      loadCover(song.cover);
      audio.src = song.src;
      audio.currentTime = 0;
      if (autoplay) { activeLoad.started = true; audio.play().catch(() => {}); }
    }

    // m4a/mp4：fetch 分块下载，moov 就绪即开播，否则下完再播
    async function loadFetch(i, autoplay) {
      current = i;
      const song = songs[i];
      clearLoad();
      clearCover();
      const ld = {
        chunks: [], received: 0, total: 0, objectUrl: null,
        started: false, complete: false, playing: !!autoplay,
        lastExtend: 0, lastMoovCheck: 0, extending: false, controller: null,
      };
      activeLoad = ld;
      titleEl.textContent = song.name;
      fill.style.width = '0%';
      thumb.style.left = '0%';
      buffer.style.width = '0%';
      timeEl.textContent = '00:00 / 00:00';
      renderList();
      loadCover(song.cover);

      const controller = new AbortController();
      ld.controller = controller;
      try {
        const res = await fetch(song.src, { signal: controller.signal });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        ld.total = parseInt(res.headers.get('Content-Length') || '0', 10) || 0;
        const reader = res.body.getReader();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          ld.chunks.push(value);
          ld.received += value.length;
          updateDownload(ld);
          maybeStartOrExtend(ld);
          if (activeLoad !== ld) return;
        }
        ld.complete = true;
        if (!ld.started) startPlayback(ld);
        else extendIfNeeded(ld, true);
      } catch (e) {
        if (e && e.name === 'AbortError') return;
        titleEl.textContent = '加载失败：' + String(e && e.message ? e.message : e);
      }
    }

    function playIndex(i) {
      if (i === current) { togglePlay(); return; }
      load(i, true);
    }

    function togglePlay() {
      if (current < 0) { if (songs.length) load(0, true); return; }
      if (activeLoad && !activeLoad.started) { activeLoad.playing = true; return; }
      if (audio.paused) audio.play().catch(() => {}); else audio.pause();
    }

    function setPlayIcon(playing) {
      playIcon.innerHTML = '<path d="' + (playing ? PAUSE_PATH : PLAY_PATH) + '"></path>';
    }

    const VOL_HIGH = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z';
    const VOL_LOW  = 'M3 9v6h4l5 5V4L7 9H3zm10.5 3a4.5 4.5 0 0 0-.5-2.03v4.06A4.5 4.5 0 0 0 13.5 12z';
    const VOL_MUTE = 'M3 9v6h4l5 5V4L7 9H3zm13.59 3l2.7-2.7-1.41-1.42-2.7 2.71-2.71-2.71-1.41 1.42 2.7 2.7-2.7 2.71 1.41 1.41 2.71-2.7 2.7 2.7 1.41-1.41-2.7-2.71z';

    const LOOP_LIST = '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>';
    const LOOP_SINGLE = '<path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><text x="12" y="15.5" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor">1</text>';
    const LOOP_RANDOM = '<path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>';

    let loopMode = 'list'; // 循环模式：list(列表) | single(单曲) | random(随机)，默认列表循环

    function updateLoopIcon() {
      const icon = loopMode === 'list' ? LOOP_LIST : (loopMode === 'single' ? LOOP_SINGLE : LOOP_RANDOM);
      loopIcon.innerHTML = icon;
      loopBtn.setAttribute('aria-label', loopMode === 'list' ? '列表循环' : (loopMode === 'single' ? '单曲循环' : '随机循环'));
    }

    function cycleLoop() {
      loopMode = loopMode === 'list' ? 'single' : (loopMode === 'single' ? 'random' : 'list');
      updateLoopIcon();
    }

    function randomIndex() {
      if (songs.length <= 1) return current;
      let i;
      do { i = Math.floor(Math.random() * songs.length); } while (i === current);
      return i;
    }

    let volume = 0.5;
    let lastVolume = 0.5;

    function updateVolIcon() {
      const path = volume === 0 ? VOL_MUTE : (volume < 0.5 ? VOL_LOW : VOL_HIGH);
      volIcon.innerHTML = '<path d="' + path + '"></path>';
    }

    function setVolume(v) {
      v = Math.min(1, Math.max(0, v));
      volume = v;
      audio.volume = v;
      if (v > 0) lastVolume = v;
      const w = (v * 100) + '%';
      volFill.style.height = w;
      volThumb.style.bottom = w;
      updateVolIcon();
    }

    function setVolumeFromEvent(e) {
      const rect = volTrack.getBoundingClientRect();
      let ratio = 1 - (e.clientY - rect.top) / rect.height;
      setVolume(Math.min(1, Math.max(0, ratio)));
    }

    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      volPop.classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (volPop.classList.contains('open') && !volPop.contains(e.target) && !muteBtn.contains(e.target)) {
        volPop.classList.remove('open');
      }
    });
    volTrack.addEventListener('pointerdown', (e) => {
      volDragging = true;
      try { volTrack.setPointerCapture(e.pointerId); } catch (err) {}
      setVolumeFromEvent(e);
    });
    volTrack.addEventListener('pointermove', (e) => { if (volDragging) setVolumeFromEvent(e); });
    volTrack.addEventListener('pointerup', () => { volDragging = false; });
    volTrack.addEventListener('pointercancel', () => { volDragging = false; });

    function seekFromEvent(e) {
      const rect = track.getBoundingClientRect();
      let ratio = (e.clientX - rect.left) / rect.width;
      ratio = Math.min(1, Math.max(0, ratio));
      let target = ratio * (audio.duration || 0);
      // 未下载完时，不能拖到尚未下载到的位置
      const ld = activeLoad;
      if (ld && !ld.complete && audio.buffered.length) {
        const end = audio.buffered.end(audio.buffered.length - 1);
        if (target > end) target = end;
      }
      if (isFinite(target)) audio.currentTime = target;
      const r2 = audio.duration ? target / audio.duration : ratio;
      const w = (Math.min(1, Math.max(0, r2)) * 100) + '%';
      fill.style.width = w;
      thumb.style.left = w;
      updateTimeLabel();
    }

    audio.addEventListener('play', () => { if (activeLoad) activeLoad.started = true; setPlayIcon(true); });
    audio.addEventListener('pause', () => setPlayIcon(false));
    audio.addEventListener('progress', updateNativeBuffer);
    audio.addEventListener('canplay', updateNativeBuffer);
    audio.addEventListener('error', () => {
      if (activeLoad && activeLoad.native) titleEl.textContent = '加载失败';
    });
    audio.addEventListener('timeupdate', () => {
      if (dragging) return;
      const ratio = audio.duration ? (audio.currentTime / audio.duration) : 0;
      fill.style.width = (ratio * 100) + '%';
      thumb.style.left = (ratio * 100) + '%';
      updateTimeLabel();
    });
    audio.addEventListener('loadedmetadata', () => {
      updateTimeLabel();
      const durSpan = durEls[current];
      if (durSpan) durSpan.textContent = fmt(audio.duration);
    });
    audio.addEventListener('ended', () => {
      if (loopMode === 'single') { load(current, true); return; }
      if (loopMode === 'random') { load(randomIndex(), true); return; }
      load((current + 1) % songs.length, true);
    });

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', () => {
      if (loopMode === 'random') { load(randomIndex(), true); return; }
      load((current - 1 + songs.length) % songs.length, true);
    });
    nextBtn.addEventListener('click', () => {
      if (loopMode === 'random') { load(randomIndex(), true); return; }
      load((current + 1) % songs.length, true);
    });
    loopBtn.addEventListener('click', cycleLoop);

    track.addEventListener('pointerdown', (e) => {
      dragging = true;
      try { track.setPointerCapture(e.pointerId); } catch (err) {}
      seekFromEvent(e);
    });
    track.addEventListener('pointermove', (e) => { if (dragging) seekFromEvent(e); });
    track.addEventListener('pointerup', () => { dragging = false; });
    track.addEventListener('pointercancel', () => { dragging = false; });

    function loadSongs() {
      renderSongList();
      if (songs.length) load(0, true); // 默认进入页面直接播放第一首
      else titleEl.textContent = '列表为空';
    }

    setVolume(0.5);
    updateLoopIcon();
    loadSongs();
  </script>
</body>
</html>
