<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐推荐</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .wrap h1 { font-size: 28px; color: #1f2328; padding-bottom: .3em; border-bottom: 1px solid #d8dee4; margin-bottom: 24px; }
    .player {
      background: #fff; border: 1px solid #e3e8ef; border-radius: 16px;
      padding: 24px; box-shadow: 0 6px 20px rgba(0,0,0,.06); margin-bottom: 28px;
      display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
    }
    .player-cover {
      width: 120px; height: 120px; border-radius: 14px; flex: 0 0 auto;
      background: linear-gradient(135deg, #6ba0ea, #9b6fe0);
      display: flex; align-items: center; justify-content: center; color: #fff;
      box-shadow: 0 8px 24px rgba(107,160,234,.35);
    }
    .player-cover svg { width: 52px; height: 52px; }
    .player-main { flex: 1 1 280px; min-width: 0; }
    .player-title { font-size: 20px; font-weight: 600; color: #1f2328; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-artist { font-size: 14px; color: #59636e; margin-top: 4px; margin-bottom: 16px; }
    .player-progress { display: flex; align-items: center; gap: 10px; }
    .progress-track {
      position: relative; flex: 1; height: 6px; border-radius: 3px;
      background: #e3e8ef; cursor: pointer; touch-action: none;
    }
    .progress-fill {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
      border-radius: 3px; background: linear-gradient(135deg, #6ba0ea, #9b6fe0);
    }
    .progress-thumb {
      position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; border-radius: 50%; background: #fff;
      border: 3px solid #6ba0ea; box-shadow: 0 1px 4px rgba(0,0,0,.2); pointer-events: none;
    }
    .time { font-size: 12px; color: #59636e; font-variant-numeric: tabular-nums; min-width: 40px; text-align: center; }
    .player-controls { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 16px; }
    .ctrl-btn {
      border: none; background: transparent; cursor: pointer; color: #1f2328;
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .ctrl-btn svg { width: 26px; height: 26px; }
    .play-btn {
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, #6ba0ea, #9b6fe0); color: #fff;
      box-shadow: 0 6px 18px rgba(107,160,234,.4); transition: transform .15s;
    }
    .play-btn:hover { transform: scale(1.06); }
    .play-btn svg { width: 24px; height: 24px; }
    .song-list {
      list-style: none; background: #fff; border: 1px solid #e3e8ef;
      border-radius: 16px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.06);
    }
    .song-item {
      display: flex; align-items: center; gap: 14px; padding: 14px 18px;
      border-bottom: 1px solid #eef1f5; cursor: pointer; transition: background .15s;
    }
    .song-item:last-child { border-bottom: none; }
    .song-item:hover { background: #f6f8fa; }
    .song-item.active { background: linear-gradient(135deg, rgba(107,160,234,.12), rgba(155,111,224,.12)); }
    .song-index { width: 24px; text-align: center; color: #59636e; font-size: 14px; flex: 0 0 auto; }
    .song-item.active .song-index { color: #9b6fe0; font-weight: 700; }
    .song-meta { flex: 1; min-width: 0; }
    .song-title { font-size: 16px; color: #1f2328; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-item.active .song-title { color: #9b6fe0; font-weight: 600; }
    .song-artist { font-size: 13px; color: #59636e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-dur { font-size: 13px; color: #59636e; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
    @media (max-width: 560px) {
      .player { flex-direction: column; text-align: center; }
      .player-main { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>音乐推荐</h1>
    <div class="player">
      <div class="player-cover" id="cover">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      </div>
      <div class="player-main">
        <div class="player-title" id="title">未选择歌曲</div>
        <div class="player-artist" id="artist">—</div>
        <div class="player-progress">
          <span class="time" id="cur">0:00</span>
          <div class="progress-track" id="track">
            <div class="progress-fill" id="fill"></div>
            <div class="progress-thumb" id="thumb"></div>
          </div>
          <span class="time" id="dur">0:00</span>
        </div>
        <div class="player-controls">
          <button class="ctrl-btn" id="prev" aria-label="上一首">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="ctrl-btn play-btn" id="play" aria-label="播放/暂停">
            <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="ctrl-btn" id="next" aria-label="下一首">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zm-9.5 0l8.5 6-8.5 6z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <ul class="song-list" id="list"></ul>
    <audio id="audio" preload="metadata"></audio>
  </main>
  <script>
    const LIST_URL = 'https://cloudflare.moonlord.cc/static/static.json';
    let songs = [];

    // 从文件名解析 歌手 - 曲名；优先用 URL（已百分号/原始混合编码，解码即可，规避源 file 字段编码问题）
    function parseItem(item) {
      const raw = (item && item.url && item.url[0]) || (item && item.file) || '';
      let name = String(raw).split('/').pop() || raw;
      try { name = decodeURIComponent(name); } catch (e) {}
      name = name.replace(/\.[^.]+$/, '');
      let artist = '', title = name;
      const idx = name.indexOf(' - ');
      if (idx > 0) {
        artist = name.slice(0, idx).trim();
        title = name.slice(idx + 3).trim();
      }
      return { title, artist, src: raw };
    }

    async function loadSongs() {
      try {
        const res = await fetch(LIST_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        songs = (Array.isArray(data) ? data : []).map(parseItem).filter(s => s.src);
        if (songs.length) {
          titleEl.textContent = '共 ' + songs.length + ' 首，点击歌曲开始播放';
        } else {
          titleEl.textContent = '列表为空';
        }
        renderList();
      } catch (e) {
        titleEl.textContent = '列表加载失败';
        artistEl.textContent = String(e && e.message ? e.message : e);
      }
    }

    const audio = document.getElementById('audio');
    const titleEl = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    const curEl = document.getElementById('cur');
    const durEl = document.getElementById('dur');
    const track = document.getElementById('track');
    const fill = document.getElementById('fill');
    const thumb = document.getElementById('thumb');
    const playBtn = document.getElementById('play');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const listEl = document.getElementById('list');

    let current = -1;
    let dragging = false;

    const PLAY_PATH = 'M8 5v14l11-7z';
    const PAUSE_PATH = 'M6 5h4v14H6zM14 5h4v14h-4z';

    function escapeHtml(s) {
      return String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
    }

    function fmt(t) {
      if (!isFinite(t) || t < 0) return '0:00';
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      return m + ':' + String(s).padStart(2, '0');
    }

    function renderList() {
      listEl.innerHTML = '';
      songs.forEach((song, i) => {
        const li = document.createElement('li');
        li.className = 'song-item' + (i === current ? ' active' : '');
        li.innerHTML =
          '<span class="song-index">' + (i + 1) + '</span>' +
          '<div class="song-meta">' +
            '<div class="song-title">' + escapeHtml(song.title) + '</div>' +
            '<div class="song-artist">' + escapeHtml(song.artist || '') + '</div>' +
          '</div>' +
          '<span class="song-dur" data-dur="' + i + '">—</span>';
        li.addEventListener('click', () => playIndex(i));
        listEl.appendChild(li);
      });
    }

    function load(i, autoplay) {
      current = i;
      const song = songs[i];
      audio.src = song.src;
      titleEl.textContent = song.title;
      artistEl.textContent = song.artist || '—';
      curEl.textContent = '0:00';
      durEl.textContent = '0:00';
      fill.style.width = '0%';
      thumb.style.left = '0%';
      renderList();
      if (autoplay) audio.play().catch(() => {});
    }

    function playIndex(i) {
      if (i === current) { togglePlay(); return; }
      load(i, true);
    }

    function togglePlay() {
      if (current < 0) { if (songs.length) load(0, true); return; }
      if (audio.paused) audio.play().catch(() => {}); else audio.pause();
    }

    function setPlayIcon(playing) {
      playIcon.innerHTML = '<path d="' + (playing ? PAUSE_PATH : PLAY_PATH) + '"></path>';
    }

    function seekFromEvent(e) {
      const rect = track.getBoundingClientRect();
      let ratio = (e.clientX - rect.left) / rect.width;
      ratio = Math.min(1, Math.max(0, ratio));
      if (isFinite(audio.duration)) audio.currentTime = ratio * audio.duration;
      fill.style.width = (ratio * 100) + '%';
      thumb.style.left = (ratio * 100) + '%';
    }

    audio.addEventListener('play', () => setPlayIcon(true));
    audio.addEventListener('pause', () => setPlayIcon(false));
    audio.addEventListener('timeupdate', () => {
      if (dragging) return;
      const ratio = audio.duration ? (audio.currentTime / audio.duration) : 0;
      fill.style.width = (ratio * 100) + '%';
      thumb.style.left = (ratio * 100) + '%';
      curEl.textContent = fmt(audio.currentTime);
    });
    audio.addEventListener('loadedmetadata', () => {
      durEl.textContent = fmt(audio.duration);
      const durSpan = listEl.querySelector('[data-dur="' + current + '"]');
      if (durSpan) durSpan.textContent = fmt(audio.duration);
    });
    audio.addEventListener('ended', () => {
      const next = (current + 1) % songs.length;
      load(next, true);
    });

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', () => {
      const i = (current - 1 + songs.length) % songs.length;
      load(i, true);
    });
    nextBtn.addEventListener('click', () => {
      const i = (current + 1) % songs.length;
      load(i, true);
    });

    track.addEventListener('pointerdown', (e) => {
      dragging = true;
      try { track.setPointerCapture(e.pointerId); } catch (err) {}
      seekFromEvent(e);
    });
    track.addEventListener('pointermove', (e) => { if (dragging) seekFromEvent(e); });
    track.addEventListener('pointerup', () => { dragging = false; });
    track.addEventListener('pointercancel', () => { dragging = false; });

    loadSongs();
  </script>
</body>
</html>
