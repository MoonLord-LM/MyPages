<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      color: #1f2328; line-height: 1.6; background: #fafafa;
    }
    /* .wrap 统一由公共模板 header.html 定义 */
    h1 { font-size: 28px; color: #1f2328; padding-bottom: .3em; border-bottom: 1px solid #d8dee4; margin-bottom: 28px; line-height: 1.25; }
    .tool-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .tool-card {
      display: block; background: #fff; border: 1px solid #e3e8ef; border-radius: 14px;
      padding: 24px; color: #1f2328; box-shadow: 0 6px 20px rgba(0,0,0,.06);
      text-decoration: none;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .tool-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,.1); border-color: #0969da; }
    .tool-card h2 { font-size: 20px; color: #1f2328; margin-bottom: 8px; }
    .tool-card p { color: #59636e; font-size: 14px; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>浏览器本地运行的一些实用工具</h1>
    <div class="tool-list">
      <a class="tool-card" href="file-encrypt-aes-256-gcm.html">
        <h2>文件加解密 - AES-256-GCM 算法</h2>
        <p>使用输入的密码派生出 256 位密钥，再对文件进行 <code>AES-256-GCM</code> 加解密。</p>
      </a>
      <a class="tool-card" href="file-encode-pem.html">
        <h2>文件编解码 - PEM 格式</h2>
        <p>将输入的文件编码为 <code>PEM</code> 格式，或将其解码还原为原始文件。</p>
      </a>
      <a class="tool-card" href="qrcode-encode.html">
        <h2>二维码生成 - 文本转图片</h2>
        <p>将输入文本（支持中文）编码为二维码，输出 <code>SVG</code> 矢量代码与 <code>PNG</code> 位图。</p>
      </a>
      <a class="tool-card" href="qrcode-decode.html">
        <h2>二维码识别 - 图片转文本</h2>
        <p>从选择、拖拽或粘贴的图片中识别二维码，还原为原始文本。</p>
      </a>
    </div>

  </main>
</body>
</html>
