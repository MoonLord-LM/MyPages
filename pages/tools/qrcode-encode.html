<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二维码生成 - 文本转图片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      color: #1f2328; line-height: 1.6; background: #fafafa;
    }
    /* .wrap 统一由公共模板 header.html 定义 */
    h1 { font-size: 28px; color: #1f2328; margin-bottom: 8px; line-height: 1.25; }

    .panel { background: #fff; border: 1px solid #e3e8ef; border-radius: 14px; padding: 24px; box-shadow: 0 6px 20px rgba(0,0,0,.05); }
    .field { margin-bottom: 20px; }
    .field label { display: block; font-weight: 600; color: #1f2328; margin-bottom: 6px; }
    .field .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 12px; }
    .field .row > span { display: inline-flex; flex-wrap: wrap; gap: 12px; }
    .text-input {
      width: 100%; padding: 11px 14px; font-size: 16px; border: 1px solid #ccc;
      border-radius: 8px; outline: none; resize: vertical; font-family: inherit;
    }
    .text-input:focus { border-color: #2a5298; }
    .code-out {
      width: 100%; padding: 11px 14px; font-size: 14px; border: 1px solid #ccc;
      border-radius: 8px; outline: none; resize: vertical; color: #1f2328;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-variant-ligatures: none; background: #f6f8fa;
    }
    .code-out:focus { border-color: #2a5298; }

    .actions {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start;
      gap: 12px; margin: 28px 0;
    }
    .mode-tabs {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start;
      gap: 12px; margin: 20px 0;
    }
    .btn, .btn-mini {
      min-width: 132px; padding: 11px 22px; font-size: 16px; font-weight: 600; line-height: 1.5;
      border: 1px solid transparent; border-radius: 8px; cursor: pointer;
      transition: opacity .2s, transform .1s, border-color .2s, background .2s, color .2s;
    }
    .mode-tabs button {
      min-width: 84px; padding: 7px 14px; font-size: 13px; font-weight: 600; line-height: 1.4;
      border: 1px solid transparent; border-radius: 8px; cursor: pointer;
      transition: opacity .2s, transform .1s, border-color .2s, background .2s, color .2s;
    }
    .btn-mini, .mode-tabs button { color: #2a5298; background: #fff; border-color: #cdd7e3; }
    .btn, .mode-tabs button.active {
      color: #fff; background: linear-gradient(135deg, #6ba0ea, #9b6fe0); border-color: transparent;
    }
    .btn:hover, .mode-tabs button.active:hover { opacity: .92; }
    .btn-mini:hover, .mode-tabs button:not(.active):hover { border-color: #2a5298; background: #f0f5fc; }
    .btn:active, .btn-mini:active, .mode-tabs button:active { transform: translateY(1px); }
    .btn:disabled, .btn-mini:disabled, .mode-tabs button:disabled { opacity: .5; cursor: not-allowed; }

    .qr-preview {
      display: inline-block; padding: 12px; background: #fff; border: 1px solid #e3e8ef;
      border-radius: 10px; line-height: 0;
    }
    .qr-preview img { display: block; width: 240px; height: 240px; image-rendering: pixelated; }

    .output.hide { display: none; }

    .log {
      margin-top: 20px; border-radius: 10px; padding: 14px 16px; font-size: 14px;
      background: #f6f8fa; border: 1px solid #e3e8ef; white-space: pre-wrap; word-break: break-all;
      max-height: 240px; overflow: auto;
    }
    .log.ok { background: #eafaf0; border-color: #b7e4c7; color: #1a7f43; }
    .log.err { background: #fdecec; border-color: #f5c2c2; color: #b3261e; }
    .log.hide { display: none; }

    .tips { margin-bottom: 44px; background: #f3f7fc; border: 1px solid #dce6f2; border-radius: 10px; padding: 12px 16px; font-size: 14px; color: #59636e; }
    .tips div { line-height: 1.8; }
    .tips code { background: #e3ecf7; padding: .05em .35em; border-radius: 4px; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>二维码生成 - 文本转图片</h1>

    <div class="tips">
      <div>将输入的文本编码为二维码，并输出可复制的 <code>SVG</code> 矢量代码与 <code>PNG</code> / <code>JPG</code> 位图。</div>
      <div>采用 <code>UTF-8</code> 字节模式编码，纠错等级可选 <code>低(L)</code> / <code>中(M)</code> / <code>高(Q)</code> / <code>最高(H)</code>，版本（尺寸）根据内容长度自动选择 1-40。</div>
      <div>四周预留 4 个模块宽的静区（quiet zone），符合扫码规范。</div>
      <div>全程在浏览器本地完成，不会上传任何数据。</div>
    </div>

    <div class="panel">
      <div class="field">
        <label for="text">输入文本</label>
        <textarea id="text" class="text-input" rows="5" placeholder="请输入要生成二维码的文本"></textarea>
      </div>

      <div class="field">
        <label>纠错等级</label>
        <div class="mode-tabs" id="eccTabs">
          <button type="button" data-ecc="L">低 (L)</button>
          <button type="button" data-ecc="M" class="active">中 (M)</button>
          <button type="button" data-ecc="Q">高 (Q)</button>
          <button type="button" data-ecc="H">最高 (H)</button>
        </div>
      </div>

      <div class="field">
        <label>每模块像素数</label>
        <div class="mode-tabs" id="scaleTabs">
          <button type="button" data-scale="1">1</button>
          <button type="button" data-scale="4">4</button>
          <button type="button" data-scale="8" class="active">8</button>
          <button type="button" data-scale="16">16</button>
          <button type="button" data-scale="32">32</button>
          <button type="button" data-scale="64">64</button>
          <button type="button" data-scale="128">128</button>
        </div>
      </div>

      <div class="field">
        <label>边缘留白模块数</label>
        <div class="mode-tabs" id="quietTabs">
          <button type="button" data-quiet="0">0</button>
          <button type="button" data-quiet="2">2</button>
          <button type="button" data-quiet="4" class="active">4</button>
          <button type="button" data-quiet="6">6</button>
          <button type="button" data-quiet="8">8</button>
          <button type="button" data-quiet="16">16</button>
          <button type="button" data-quiet="32">32</button>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="genBtn" type="button">生成二维码</button>
      </div>

      <div class="output hide" id="output">
        <div class="field">
          <label>二维码图片预览</label>
          <div class="qr-preview" style="margin-top:12px"><img id="pngOut" alt="二维码图片预览"></div>
        </div>

        <div class="field">
          <div class="row">
            <label style="margin-bottom:0">位图文件</label>
            <span>
              <button class="btn-mini" id="downloadPng" type="button">下载 PNG</button>
              <button class="btn-mini" id="downloadJpg" type="button">下载 JPG</button>
              <button class="btn-mini" id="downloadPng1bit" type="button">下载 PNG (1-bit)</button>
            </span>
          </div>
        </div>

        <div class="field">
          <div class="row">
            <label style="margin-bottom:0">SVG 矢量图</label>
            <span>
              <button class="btn-mini" id="copySvg" type="button">复制代码</button>
              <button class="btn-mini" id="downloadSvg" type="button">下载 SVG</button>
            </span>
          </div>
        </div>

        <div class="field">
          <label>SVG 代码预览</label>
          <textarea id="svgOut" class="code-out" readonly rows="6" style="margin-top:12px"></textarea>
        </div>
      </div>

      <div class="log hide" id="log"></div>
    </div>
  </main>

  <script>
  // ===== 纯 JS 二维码生成器（基于 Project Nayuki 的 QR Code generator，公有领域）=====
  // 仅使用字节模式（UTF-8），自动选择版本与最优掩码，不依赖任何外部库与网络。
  (function () {
    'use strict';

    const QrCode = (function () {
      const PENALTY_N1 = 3, PENALTY_N2 = 3, PENALTY_N3 = 40, PENALTY_N4 = 10;

      const ECC = {
        L: { ordinal: 0, formatBits: 1 },
        M: { ordinal: 1, formatBits: 0 },
        Q: { ordinal: 2, formatBits: 3 },
        H: { ordinal: 3, formatBits: 2 },
      };

      const ECC_CODEWORDS_PER_BLOCK = [
        [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
        [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
        [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
        [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
      ];
      const NUM_ERROR_CORRECTION_BLOCKS = [
        [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
        [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
        [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
        [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81],
      ];

      function assert(cond, msg) { if (!cond) throw new Error(msg); }
      function getBit(x, i) { return ((x >>> i) & 1) !== 0; }
      function appendBits(val, len, bb) {
        if (len < 0 || len > 31 || val >>> len !== 0) throw new RangeError('Value out of range');
        for (let i = len - 1; i >= 0; i--) bb.push((val >>> i) & 1);
      }

      function reedSolomonMultiply(x, y) {
        let z = 0;
        for (let i = 7; i >= 0; i--) {
          z = (z << 1) ^ ((z >>> 7) * 0x11D);
          z ^= ((y >>> i) & 1) * x;
        }
        return z & 0xFF;
      }
      function reedSolomonComputeDivisor(degree) {
        const result = [];
        for (let i = 0; i < degree - 1; i++) result.push(0);
        result.push(1);
        let root = 1;
        for (let i = 0; i < degree; i++) {
          for (let j = 0; j < result.length; j++) {
            result[j] = reedSolomonMultiply(result[j], root);
            if (j + 1 < result.length) result[j] ^= result[j + 1];
          }
          root = reedSolomonMultiply(root, 0x02);
        }
        return result;
      }
      function reedSolomonComputeRemainder(data, divisor) {
        const result = divisor.map(() => 0);
        for (const b of data) {
          const factor = b ^ result.shift();
          result.push(0);
          divisor.forEach((coef, i) => { result[i] ^= reedSolomonMultiply(coef, factor); });
        }
        return result;
      }

      function getNumRawDataModules(ver) {
        let result = (16 * ver + 128) * ver + 64;
        if (ver >= 2) {
          const numAlign = Math.floor(ver / 7) + 2;
          result -= (25 * numAlign - 10) * numAlign - 55;
          if (ver >= 7) result -= 36;
        }
        return result;
      }
      function getNumDataCodewords(ver, ecl) {
        return Math.floor(getNumRawDataModules(ver) / 8) -
          ECC_CODEWORDS_PER_BLOCK[ecl.ordinal][ver] * NUM_ERROR_CORRECTION_BLOCKS[ecl.ordinal][ver];
      }
      function getAlignmentPatternPositions(ver) {
        if (ver === 1) return [];
        const numAlign = Math.floor(ver / 7) + 2;
        const step = (ver === 32) ? 26 : Math.ceil((ver * 4 + 4) / (numAlign * 2 - 2)) * 2;
        const result = [6];
        for (let pos = ver * 4 + 10; result.length < numAlign; pos -= step) result.splice(1, 0, pos);
        return result;
      }

      class Code {
        constructor(version, ecl, dataCodewords, msk) {
          this.version = version;
          this.errorCorrectionLevel = ecl;
          this.size = version * 4 + 17;
          this.modules = [];
          this.isFunction = [];
          for (let i = 0; i < this.size; i++) {
            this.modules.push(new Array(this.size).fill(false));
            this.isFunction.push(new Array(this.size).fill(false));
          }
          this.drawFunctionPatterns();
          const allCodewords = this.addEccAndInterleave(dataCodewords);
          this.drawCodewords(allCodewords);
          if (msk === -1) {
            let minPenalty = 1000000000;
            for (let i = 0; i < 8; i++) {
              this.applyMask(i);
              this.drawFormatBits(i);
              const penalty = this.getPenaltyScore();
              if (penalty < minPenalty) { msk = i; minPenalty = penalty; }
              this.applyMask(i);
            }
          }
          assert(0 <= msk && msk <= 7, 'Mask value out of range');
          this.mask = msk;
          this.applyMask(msk);
          this.drawFormatBits(msk);
          this.isFunction = [];
        }

        static encodeSegments(segs, ecl, minVersion, maxVersion, mask, boostEcl) {
          if (minVersion < 1 || minVersion > 40) throw new RangeError('Version value out of range');
          if (maxVersion < 1 || maxVersion > 40) throw new RangeError('Version value out of range');
          if (minVersion > maxVersion) throw new RangeError('minVersion > maxVersion');
          let version, dataUsedBits;
          for (version = minVersion; ; version++) {
            const dataCapacityBits = getNumDataCodewords(version, ecl) * 8;
            const usedBits = QrSegment.getTotalBits(segs, version);
            if (usedBits <= dataCapacityBits) { dataUsedBits = usedBits; break; }
            if (version >= maxVersion) throw new RangeError('Data too long');
          }

          if (boostEcl) {
            for (const newEcl of [ECC.M, ECC.Q, ECC.H]) {
              if (dataUsedBits <= getNumDataCodewords(version, newEcl) * 8) ecl = newEcl;
            }
          }

          const bb = [];
          for (const seg of segs) {
            const ccbits = version <= 9 ? 8 : version <= 26 ? 16 : 16;
            appendBits(4, 4, bb); // 字节模式固定为 0x4
            appendBits(seg.numChars, ccbits, bb);
            for (const b of seg.bitData) appendBits(b, 1, bb);
          }

          const dataCapacityBits = getNumDataCodewords(version, ecl) * 8;
          assert(bb.length <= dataCapacityBits, 'Assertion error');
          appendBits(0, Math.min(4, dataCapacityBits - bb.length), bb);
          appendBits(0, (8 - bb.length % 8) % 8, bb);
          for (let padByte = 0xEC; bb.length < dataCapacityBits; padByte ^= 0xEC ^ 0x11)
            appendBits(padByte, 8, bb);

          const dataCodewords = [];
          while (dataCodewords.length * 8 < bb.length) dataCodewords.push(0);
          bb.forEach((b, i) => { dataCodewords[i >>> 3] |= b << (7 - (i & 7)); });

          return new Code(version, ecl, dataCodewords, mask);
        }

        drawFunctionPatterns() {
          for (let i = 0; i < this.size; i++) {
            this.setFunctionModule(6, i, i % 2 === 0);
            this.setFunctionModule(i, 6, i % 2 === 0);
          }
          this.drawFinderPattern(3, 3);
          this.drawFinderPattern(this.size - 4, 3);
          this.drawFinderPattern(3, this.size - 4);
          const alignPos = getAlignmentPatternPositions(this.version);
          const n = alignPos.length;
          for (let i = 0; i < n; i++) {
            for (let j = 0; j < n; j++) {
              if (!(i === 0 && j === 0 || i === 0 && j === n - 1 || i === n - 1 && j === 0))
                this.drawAlignmentPattern(alignPos[i], alignPos[j]);
            }
          }
          this.drawFormatBits(0);
          this.drawVersion();
        }

        drawFormatBits(mask) {
          const data = this.errorCorrectionLevel.formatBits << 3 | mask;
          let rem = data;
          for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
          const bits = (data << 10 | rem) ^ 0x5412;
          assert(bits >>> 15 === 0, 'Assertion error');
          for (let i = 0; i <= 5; i++) this.setFunctionModule(8, i, getBit(bits, i));
          this.setFunctionModule(8, 7, getBit(bits, 6));
          this.setFunctionModule(8, 8, getBit(bits, 7));
          this.setFunctionModule(7, 8, getBit(bits, 8));
          for (let i = 9; i < 15; i++) this.setFunctionModule(14 - i, 8, getBit(bits, i));
          for (let i = 0; i < 8; i++) this.setFunctionModule(this.size - 1 - i, 8, getBit(bits, i));
          for (let i = 8; i < 15; i++) this.setFunctionModule(8, this.size - 15 + i, getBit(bits, i));
          this.setFunctionModule(8, this.size - 8, true);
        }

        drawVersion() {
          if (this.version < 7) return;
          let rem = this.version;
          for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
          const bits = this.version << 12 | rem;
          assert(bits >>> 18 === 0, 'Assertion error');
          for (let i = 0; i < 18; i++) {
            const color = getBit(bits, i);
            const a = this.size - 11 + i % 3;
            const b = Math.floor(i / 3);
            this.setFunctionModule(a, b, color);
            this.setFunctionModule(b, a, color);
          }
        }

        drawFinderPattern(x, y) {
          for (let dy = -4; dy <= 4; dy++) {
            for (let dx = -4; dx <= 4; dx++) {
              const dist = Math.max(Math.abs(dx), Math.abs(dy));
              const xx = x + dx, yy = y + dy;
              if (0 <= xx && xx < this.size && 0 <= yy && yy < this.size)
                this.setFunctionModule(xx, yy, dist !== 2 && dist !== 4);
            }
          }
        }

        drawAlignmentPattern(x, y) {
          for (let dy = -2; dy <= 2; dy++)
            for (let dx = -2; dx <= 2; dx++)
              this.setFunctionModule(x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }

        setFunctionModule(x, y, isDark) {
          this.modules[y][x] = isDark;
          this.isFunction[y][x] = true;
        }

        addEccAndInterleave(data) {
          const ver = this.version;
          const ecl = this.errorCorrectionLevel;
          const numBlocks = NUM_ERROR_CORRECTION_BLOCKS[ecl.ordinal][ver];
          const blockEccLen = ECC_CODEWORDS_PER_BLOCK[ecl.ordinal][ver];
          const rawCodewords = Math.floor(getNumRawDataModules(ver) / 8);
          const numShortBlocks = numBlocks - rawCodewords % numBlocks;
          const shortBlockLen = Math.floor(rawCodewords / numBlocks);
          const blocks = [];
          const rsDiv = reedSolomonComputeDivisor(blockEccLen);
          let k = 0;
          for (let i = 0; i < numBlocks; i++) {
            const datLen = shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1);
            const dat = data.slice(k, k + datLen);
            k += dat.length;
            const ecc = reedSolomonComputeRemainder(dat, rsDiv);
            if (i < numShortBlocks) dat.push(0);
            blocks.push(dat.concat(ecc));
          }
          const result = [];
          for (let i = 0; i < blocks[0].length; i++) {
            blocks.forEach((block, j) => {
              if (i !== shortBlockLen - blockEccLen || j >= numShortBlocks) result.push(block[i]);
            });
          }
          return result;
        }

        drawCodewords(data) {
          let i = 0;
          for (let right = this.size - 1; right >= 1; right -= 2) {
            if (right === 6) right = 5;
            for (let vert = 0; vert < this.size; vert++) {
              for (let j = 0; j < 2; j++) {
                const x = right - j;
                const upward = ((right + 1) & 2) === 0;
                const y = upward ? this.size - 1 - vert : vert;
                if (!this.isFunction[y][x] && i < data.length * 8) {
                  this.modules[y][x] = getBit(data[i >>> 3], 7 - (i & 7));
                  i++;
                }
              }
            }
          }
        }

        applyMask(mask) {
          for (let y = 0; y < this.size; y++) {
            for (let x = 0; x < this.size; x++) {
              let invert;
              switch (mask) {
                case 0: invert = (x + y) % 2 === 0; break;
                case 1: invert = y % 2 === 0; break;
                case 2: invert = x % 3 === 0; break;
                case 3: invert = (x + y) % 3 === 0; break;
                case 4: invert = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
                case 5: invert = x * y % 2 + x * y % 3 === 0; break;
                case 6: invert = (x * y % 2 + x * y % 3) % 2 === 0; break;
                case 7: invert = ((x + y) % 2 + x * y % 3) % 2 === 0; break;
                default: throw new Error('Assertion error');
              }
              if (!this.isFunction[y][x] && invert) this.modules[y][x] = !this.modules[y][x];
            }
          }
        }

        getPenaltyScore() {
          let result = 0;
          const size = this.size;
          const m = this.modules;
          for (let y = 0; y < size; y++) {
            let runColor = false, runX = 0;
            const runHistory = [0, 0, 0, 0, 0, 0, 0];
            for (let x = 0; x < size; x++) {
              if (m[y][x] === runColor) {
                runX++;
                if (runX === 5) result += PENALTY_N1;
                else if (runX > 5) result++;
              } else {
                this.finderPenaltyAddHistory(runX, runHistory);
                if (!runColor) result += this.finderPenaltyCountPatterns(runHistory) * PENALTY_N2;
                runColor = m[y][x];
                runX = 1;
              }
            }
            result += this.finderPenaltyTerminateAndCount(runColor, runX, runHistory) * PENALTY_N2;
          }
          for (let x = 0; x < size; x++) {
            let runColor = false, runY = 0;
            const runHistory = [0, 0, 0, 0, 0, 0, 0];
            for (let y = 0; y < size; y++) {
              if (m[y][x] === runColor) {
                runY++;
                if (runY === 5) result += PENALTY_N1;
                else if (runY > 5) result++;
              } else {
                this.finderPenaltyAddHistory(runY, runHistory);
                if (!runColor) result += this.finderPenaltyCountPatterns(runHistory) * PENALTY_N2;
                runColor = m[y][x];
                runY = 1;
              }
            }
            result += this.finderPenaltyTerminateAndCount(runColor, runY, runHistory) * PENALTY_N2;
          }
          for (let y = 0; y < size - 1; y++) {
            for (let x = 0; x < size - 1; x++) {
              const c = m[y][x];
              if (c === m[y][x + 1] && c === m[y + 1][x] && c === m[y + 1][x + 1]) result += PENALTY_N3;
            }
          }
          let dark = 0;
          for (const row of m) for (const c of row) if (c) dark++;
          const total = size * size;
          const k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
          result += k * PENALTY_N4;
          return result;
        }

        finderPenaltyCountPatterns(runHistory) {
          const n = runHistory[1];
          const core = n > 0 && runHistory[2] === n && runHistory[3] === n * 3 && runHistory[4] === n && runHistory[5] === n;
          return (core && runHistory[0] >= n * 4 && runHistory[6] >= n ? 1 : 0) +
                 (core && runHistory[6] >= n * 4 && runHistory[0] >= n ? 1 : 0);
        }
        finderPenaltyTerminateAndCount(currentRunColor, currentRunLength, runHistory) {
          if (currentRunColor) {
            this.finderPenaltyAddHistory(currentRunLength, runHistory);
            currentRunLength = 0;
          }
          currentRunLength += this.size;
          this.finderPenaltyAddHistory(currentRunLength, runHistory);
          return this.finderPenaltyCountPatterns(runHistory);
        }
        finderPenaltyAddHistory(currentRunLength, runHistory) {
          if (runHistory[0] === 0) currentRunLength += this.size;
          runHistory.pop();
          runHistory.unshift(currentRunLength);
        }
      }

      function toUtf8ByteArray(str) {
        str = encodeURI(str);
        const result = [];
        for (let i = 0; i < str.length; i++) {
          if (str.charAt(i) !== '%') result.push(str.charCodeAt(i));
          else { result.push(parseInt(str.substr(i + 1, 2), 16)); i += 2; }
        }
        return result;
      }

      class QrSegment {
        constructor(numChars, ccbits, bitData) {
          this.numChars = numChars;
          this.ccbits = ccbits;
          this.bitData = bitData;
        }
        static makeByteSegment(data) {
          const bb = [];
          for (const b of data) appendBits(b, 8, bb);
          return new QrSegment(data.length, 0, bb);
        }
        static getTotalBits(segs, version) {
          let result = 0;
          for (const seg of segs) {
            const ccbits = (version <= 9) ? 8 : (version <= 26) ? 16 : 16;
            if (seg.numChars >= (1 << ccbits)) return Infinity;
            result += 4 + ccbits + seg.bitData.length;
          }
          return result;
        }
      }

      function encodeText(text, eclKey) {
        const ecl = ECC[eclKey];
        const seg = QrSegment.makeByteSegment(toUtf8ByteArray(text));
        return Code.encodeSegments([seg], ecl, 1, 40, -1, false);
      }

      return { encodeText, ECC };
    })();

    // ===== 界面逻辑 =====
    const $ = (id) => document.getElementById(id);
    const textEl = $('text');
    const eccTabs = $('eccTabs');
    const scaleTabs = $('scaleTabs');
    const quietTabs = $('quietTabs');
    const genBtn = $('genBtn');
    const outputEl = $('output');
    const svgOut = $('svgOut');
    const pngOut = $('pngOut');
    const copySvgBtn = $('copySvg');
    const downloadSvgBtn = $('downloadSvg');
    const downloadPngBtn = $('downloadPng');
    const downloadJpgBtn = $('downloadJpg');
    const downloadPng1bitBtn = $('downloadPng1bit');
    const logEl = $('log');

    let quiet = 4;     // 静区宽度（模块数，可调，默认 4）
    let scale = 8;     // PNG 每模块像素（可调，默认 8）
    let ecc = 'M';
    let lastSvg = '';
    let lastQr = null;

    function clearLog() { logEl.className = 'log hide'; logEl.textContent = ''; }
    function log(msg, kind) {
      logEl.className = 'log' + (kind ? ' ' + kind : '');
      logEl.textContent = msg;
    }

    eccTabs.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-ecc]');
      if (!btn) return;
      ecc = btn.getAttribute('data-ecc');
      eccTabs.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
    });

    scaleTabs.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-scale]');
      if (!btn) return;
      scale = parseInt(btn.getAttribute('data-scale'), 10);
      scaleTabs.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
    });

    quietTabs.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-quiet]');
      if (!btn) return;
      quiet = parseInt(btn.getAttribute('data-quiet'), 10);
      quietTabs.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
    });

    function buildSvg(qr) {
      const dim = qr.size + quiet * 2;
      let path = '';
      for (let y = 0; y < qr.size; y++) {
        for (let x = 0; x < qr.size; x++) {
          if (qr.modules[y][x]) path += 'M' + (x + quiet) + ' ' + (y + quiet) + 'h1v1h-1z';
        }
      }
      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + dim + '" height="' + dim +
        '" viewBox="0 0 ' + dim + ' ' + dim + '" shape-rendering="crispEdges">' +
        '<rect width="' + dim + '" height="' + dim + '" fill="#ffffff"/>' +
        '<path fill="#000000" d="' + path + '"/></svg>';
    }

    function buildPng(qr) {
      const dim = qr.size + quiet * 2;
      const canvas = document.createElement('canvas');
      canvas.width = dim * scale;
      canvas.height = dim * scale;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#000000';
      for (let y = 0; y < qr.size; y++) {
        for (let x = 0; x < qr.size; x++) {
          if (qr.modules[y][x]) ctx.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
        }
      }
      return canvas;
    }

    const PNG_SIG = new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]);

    // 1-bit（灰度，bit depth = 1）PNG：直接用模块矩阵打包，无需 canvas / 第三方库
    function crc32(buf) {
      crc32.t = crc32.t || (function () {
        const t = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
          t[n] = c >>> 0;
        }
        return t;
      })();
      let crc = 0xFFFFFFFF;
      for (let i = 0; i < buf.length; i++) crc = crc32.t[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8);
      return (crc ^ 0xFFFFFFFF) >>> 0;
    }

    function pngChunk(type, data) {
      const typeBytes = new TextEncoder().encode(type);
      const crcInput = new Uint8Array(typeBytes.length + data.length);
      crcInput.set(typeBytes, 0);
      crcInput.set(data, 4);
      const out = new Uint8Array(4 + 4 + data.length + 4);
      const dv = new DataView(out.buffer);
      dv.setUint32(0, data.length);
      out.set(typeBytes, 4);
      out.set(data, 8);
      dv.setUint32(8 + data.length, crc32(crcInput));
      return out;
    }

    async function compressDeflate(buf) {
      const cs = new CompressionStream('deflate');
      const writer = cs.writable.getWriter();
      writer.write(buf);
      writer.close();
      return new Uint8Array(await new Response(cs.readable).arrayBuffer());
    }

    async function buildPng1bit(qr) {
      const dim = qr.size + quiet * 2;
      const width = dim * scale, height = dim * scale;
      const rowBytes = (width + 7) >> 3;
      const raw = new Uint8Array((rowBytes + 1) * height); // 全 0：滤波字节=0，黑=0
      for (let y = 0; y < height; y++) {
        const rowStart = y * (rowBytes + 1) + 1;
        for (let x = 0; x < width; x++) {
          const mx = (x / scale | 0) - quiet;
          const my = (y / scale | 0) - quiet;
          const black = mx >= 0 && my >= 0 && mx < qr.size && my < qr.size && qr.modules[my][mx];
          if (!black) raw[rowStart + (x >> 3)] |= 0x80 >> (x & 7); // 白=1
        }
      }
      const idat = await compressDeflate(raw);
      const ihdr = new Uint8Array(13);
      const dv = new DataView(ihdr.buffer);
      dv.setUint32(0, width);
      dv.setUint32(4, height);
      ihdr[8] = 1;  // bit depth
      ihdr[9] = 0;  // color type: 灰度
      return new Blob(
        [PNG_SIG, pngChunk('IHDR', ihdr), pngChunk('IDAT', idat), pngChunk('IEND', new Uint8Array(0))],
        { type: 'image/png' });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function setBusy(busy) {
      genBtn.disabled = busy;
      genBtn.textContent = busy ? '生成中…' : '生成二维码';
    }

    function generate() {
      clearLog();
      const text = textEl.value;
      if (!text) { log('请先输入要生成二维码的文本', 'err'); return; }

      setBusy(true);
      try {
        const qr = QrCode.encodeText(text, ecc);
        lastQr = qr;
        lastSvg = buildSvg(qr);
        svgOut.value = lastSvg;
        const canvas = buildPng(qr);
        pngOut.src = canvas.toDataURL('image/png');
        outputEl.classList.remove('hide');
        log('生成成功：版本 ' + qr.version + '，尺寸 ' + qr.size + '×' + qr.size +
            ' 模块，纠错等级 ' + ecc + '\n字符数：' + new TextEncoder().encode(text).length +
            '（UTF-8 字节）', 'ok');
        downloadPngBtn.onclick = () => canvas.toBlob((b) => downloadBlob(b, 'qrcode.png'), 'image/png');
        downloadJpgBtn.onclick = () => canvas.toBlob((b) => downloadBlob(b, 'qrcode.jpg'), 'image/jpeg', 1);
        downloadPng1bitBtn.onclick = async () => {
          if (!lastQr) return;
          try {
            downloadBlob(await buildPng1bit(lastQr), 'qrcode-1bit.png');
          } catch (e) {
            log('生成 1-bit PNG 失败：' + (e && e.message ? e.message : e), 'err');
          }
        };
      } catch (e) {
        log('生成失败：' + (e && e.message ? e.message : e), 'err');
      } finally {
        setBusy(false);
      }
    }

    copySvgBtn.addEventListener('click', () => {
      if (!lastSvg) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastSvg).then(
          () => log('SVG 代码已复制到剪贴板', 'ok'),
          () => svgOut.select()
        );
      } else {
        svgOut.select();
        log('已选中 SVG 代码，请按 Ctrl+C 复制');
      }
    });
    downloadSvgBtn.addEventListener('click', () => {
      if (!lastSvg) return;
      downloadBlob(new Blob([lastSvg], { type: 'image/svg+xml' }), 'qrcode.svg');
    });

    genBtn.addEventListener('click', generate);
  })();
  </script>
</body>
</html>
