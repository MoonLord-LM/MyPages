name: github-profile

on:
  schedule:
    - cron: '57 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-profile:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run github-profile.bat
        shell: cmd
        run: call tools\github\github-profile.bat <nul

      - name: Commit and push
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "auto-build by [ github-profile.bat ]"
            git push origin HEAD
          } else {
            Write-Host 'No changes after github-profile.bat.'
          }
