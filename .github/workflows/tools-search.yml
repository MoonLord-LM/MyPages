name: tools-search

on:
  schedule:
    - cron: '57 01 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['tools/search/*.bat', 'tools/cloudflare/*.bat', '.github/workflows/tools-search.yml']

permissions:
  contents: write

concurrency:
  group: ${{ github.event.repository.name }}-${{ github.workflow }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  search:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name : Git Config
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.safecrlf false
          git config --global core.ignorecase false
          git config --global core.quotepath false
          git config --global i18n.logoutputencoding utf-8
          git config --global i18n.commitencoding utf-8
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Download Cloudflare static assets
        shell: cmd
        run: call tools\cloudflare\cloudflare-list-download.bat <nul

      - name: Run search.bat
        shell: cmd
        run: call tools\search\search.bat <nul

      - name: Commit and push
        shell: powershell
        run: |
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "auto-build by [ search.bat ]"
            git pull origin master
            git push origin HEAD
          } else {
            Write-Host 'No changes after search.bat.'
          }

      - name: Refresh Cloudflare list.json
        shell: cmd
        run: call tools\cloudflare\cloudflare-list-refresh.bat <nul

      - name: Deploy to Cloudflare Pages
        shell: cmd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: call tools\cloudflare\cloudflare-pages-deploy.bat <nul
